<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website with Opening Animation</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden; /* Prevent scrolling during animation */
        }

        /* Loading overlay styles */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000; /* Background color */
            color: #c8ff00; /* Text color */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000; /* Keep it above all content */
            animation: fadeOut 1s ease-in-out forwards;
            animation-delay: 3s; /* Duration before the fade-out starts */
        }

        .loading-text {
            text-align: center;
        }

        .loading-text h1 {
            font-size: 3rem;
            animation: slideIn 1.5s ease-out;
        }

        .loading-text p {
            font-size: 1.5rem;
            margin-top: 1rem;
            animation: fadeIn 2s ease-out;
        }

        /* Keyframes for animations */
        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Main content hidden initially */
        #main-content {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            padding: 20px;
        }

        /* Example main content styling */
        .header {
            background-color: #282c34;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .content {
            padding: 20px;
            text-align: center;
        }

        .footer {
            background-color: #282c34;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Loading animation overlay -->
    <div id="loading-overlay">
        <div class="loading-text">
            <h1>Welcome</h1>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Main website content -->
    <div id="main-content">
        <div class="header">
            <h1>My Website</h1>
        </div>
        <div class="content">
            <p>Welcome to my awesome website! Explore the features and enjoy the experience.</p>
        </div>
        <div class="footer">
            <p>&copy; 2024 My Website. All Rights Reserved.</p>
        </div>
    </div>

    <script>
        // JavaScript to handle the animation and content display
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                // Hide the loading overlay
                const overlay = document.getElementById("loading-overlay");
                overlay.style.display = "none";

                // Show the main content
                const mainContent = document.getElementById("main-content");
                mainContent.style.opacity = 1;
                
                // Allow scrolling after animation
                document.body.style.overflow = "auto";
            }, 3000); // Matches the animation duration
        });
    </script>
</body>
</html>
